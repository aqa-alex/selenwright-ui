version: "3"
services:
  selenwright-ui:
    image: "${SELENWRIGHT_UI_IMAGE:-selenwright-ui:latest}"
    ports:
      - "4173:4173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: "0.0.0.0"
      PORT: "4173"
      SELENWRIGHT_TARGET: "${SELENWRIGHT_TARGET:-http://host.docker.internal:4444}"
